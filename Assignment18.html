<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ABC College Admission 2026</title>
</head>
<body leftmargin="0" topmargin="0" rightmargin="0" bottommargin="0">
    <table width="100%" bgcolor="#1a237e" cellpadding="25" cellspacing="0" border="0">
        <tr>
            <td align="center">
                <font color="white" size="6"><b>ABC College Admission 2026</b></font>
            </td>
        </tr>
    </table>

    <br>
    <table width="550" align="center" cellpadding="5" cellspacing="0" border="0">
        <tr>
            <td>
                <h2>Courses and Fees</h2>
                <table width="100%" border="1" cellpadding="8" cellspacing="0">
                    <caption>Available Courses</caption>
                    <tr bgcolor="#e8eaf6">
                        <th width="45%">Course</th>
                        <th width="25%">Seats</th>
                        <th width="30%">Fees</th>
                    </tr>
                    <tr>
                        <td>B.Tech CSE</td>
                        <td>120</td>
                        <td>&#8377;90,000</td>
                    </tr>
                    <tr>
                        <td>BCA</td>
                        <td>60</td>
                        <td>&#8377;45,000</td>
                    </tr>
                </table>

                <br>
                <form action="#" method="post">
                    <fieldset>
                        <legend>Application Form</legend>
                        
                        <label for="name">Name:</label><br>
                        <input type="text" id="name" name="name" size="35"><br><br>

                        <label for="email">Email:</label><br>
                        <input type="email" id="email" name="email" size="35"><br><br>

                        <label for="course">Course:</label><br>
                        <select id="course" name="course">
                            <option value="btech">B.Tech CSE</option>
                            <option value="bca">BCA</option>
                        </select><br><br>

                        <label for="statement">Statement:</label><br>
                        <textarea id="statement" name="statement" rows="4" cols="60"></textarea><br><br>

                        <input type="submit" value="Apply">
                    </fieldset>
                </form>
            </td>
        </tr>
    </table>

    <br>
    <table width="100%" bgcolor="#1a237e" cellpadding="12" cellspacing="0" border="0">
        <tr>
            <td align="center">
                <font color="white">&copy; 2026 ABC College</font>
            </td>
        </tr>
    </table>

</body>
</html>
