<!DOCTYPE html>
<html>
<head>
    <title>Lists</title>
</head>
<body>

    <h4>Unordered</h4>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <h4>Ordered</h4>
    <ol type="A">
        <li>Install VS Code</li>
        <li>Create file</li>
        <li>Open in browser</li>
    </ol>

    <h4>Description</h4>
    <dl>
        <dt><b>HTML</b></dt>
        <dd>HyperText Markup Language</dd>
        <dt><b>CSS</b></dt>
        <dd>Cascading Style Sheets</dd>
    </dl>

</body>
</html>
